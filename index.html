t, Beard’s assertions could offer us possible insights.","In Beard’s term, the standardized version of individuality indicates those invisible images are no longer built for mere resemblance but a conceptualized aim. Similarly, such intentions for creating an ideal image also represents itself in sculpturing the funerary urn. Combinations of fixed cultural symbols structure the urn’s appearance. A tortoise supporting a carved tablet, paired birds, kneeling figures, these are all iconic images in Chinese funerary art. They are assigned with prefixes of fortune, eternality, and immortality, all of which are metaphors prescribed in burial culture. Such thematic adornment does not stand on its own, as an overview of funerary objects reveals its extensive presence among funerary art forms like murals, wood carvings, and architecture. Hence, for the clay urn that carries symbolic adornments, it transforms from a utility tool to the one bearing spiritual beliefs. Buried underneath the earth, the urn no longer holds grains of rice in the barn, but the living’s sincere hope for the immortality.","In addition, this object is a reference to the powerful image of its owner. If the blessings coated within the auspicious symbols already tell the full meanings of the urn, the destruction aimed at Qinshihuang’s tomb to which Beard refers would not be justified. Beard argues hidden images also parallelize the power of their owners, as “in that keen desire to destroy them lies the clearest sense of the power of these images” (Beard 60). It is reasonable that the invisible images exclusively demarcate the presence of the tomb owner. The invisible images never play innocence.","Although the combination of symbols slightly suppresses imaginative thoughts on the delicate modeling, the viewers, after all, fail to cover up admirations toward the owner’s power through burial objects. Meanwhile, the eradication of viewers’ presence helps increase in self-interpretation of the burial objects, making the exquisite craftsmanship of these images boldly displaying tomb owners’ power without any side text from viewers. Just as the Terracotta Warriors’ delicate hair, the mountainous buildings with piled roofs and guarding figure on the funerary urn flaunts about the wealth and power of its owners. Hence, the desire to reproduce the presence of the dead is ostentatiously displayed through the intricate funerary goods.","Much like its counterpart, the buried images, on the dark, opposite side of a double-sided mirror invisible to the viewers, refracts its universal truths that arrive at a distant realm of metaphorical significance.","Works Cited","Beard, Mary. “The Emperor of China and the Power of Images.” How Do We Look: The Body, the Divine, and the Question of Civilization, Liveright Publishing Corporation, New York, US, 2021, pp. 53–60.","Funerary Urn (Hunping). The Art Institute of Chicago, Https://Www.Artic.Edu/Artworks/70003/Funerary-Urn-Hunping. Accessed 13 Oct. 2023."]},"txt-11":{"title":"Communities On the Stage","paragraphs":["Considering depicting a given community through photography, narrators are naturally endowed with a responsibility to represent its authentic image, yet different people portray such representation in their own ways. Discussing the capability of outsiders to represent stories of indigenous communities through images, Teju Cole, an art historian and photographer, mainly analyzes works of both insiders and outsiders. He analyzes a Native American photographer Horace Poolaw’s works, which is considered to involve more authenticity and democracy: capturing tribal images in their currently modernized state of daily life. Meanwhile, Cole compares it with the works of Edward S. Curtis as an outsider while questioning Curtis’ methodology to offer authenticity, as Curtis emphasizes primitivism through inventing scenarios in which certain details are removed (14).","However, in Poolaw’s works, certain natures of photography are undermined: the spontaneous ability to articulate the images identities and significance by itself. That is, the background scenery and surrounding objects of the character are veiled or lacked. Thus, the audience may be confused by the ambiguous identities and historical positions of the portraits. Despite its constraints in presenting vivid scenes, indeed, we may find distinct solutions in understanding Curtis’ methodology. To this aim, we then ask: what ignored benefits might be in introducing a perspective with primitivism?","Fi.1. Sebastião, Salgado. 2005. Genesis, by Sebastião, Salgado, Taschen, 2013, p.521.","Conspicuously occupying the visual center of the photo, the Wauja fishermen are sailing for a morning fishing activity on the lake Piyulaga (Fig.1). Rather than modern elements like dinghies with motors stirring up the waves, there are merely a few wooden rafts slowly floating upon gleaming water and carrying Wauja people into the hazy distance. The heavy mist broadly spreads from the water surface to a degree that almost blurs the outline of the sun. This image conveys a strong sense of calmness, harmony, and vitality of nature with no interfering “noise”. In another scene, the man with marked tribal patterns printed over his hair and cheeks firmly gazes at an untold object beyond the perspective of picture. Fortunately, told by a slender feather piercing through his earlobe, the audience may find him to be within a ceremonial event. Without any sorts of entrances into the internal world of the picture like eye contacts with the man, the audiences fail to communicate with him. Thus, they are no more than priers whose knowledge is challenged by all exotic elements presented before them. (Fig.2)","Fig. 2. Sebastião, Salgado. 2005. Genesis, by Sebastião, Salgado, Taschen, 2013, p.465.","As the photographer behind these masterpieces, Sebastião Salgado works as a documentary photographer in Brazil. Setting foot in more than 120 countries, discovering people and the nature around neglected and silent corners of the world. In his album Genesis, he returns to primitivism and put an emphasis on natural landscapes and indigenous communities, aiming to present an experience of purity and tranquility of nature to the audience. Christopher Ball reviewed the primitive elements in the Genesis and commented, “The realist dimensions of photography reinscribe the spatiotemporal divide” (28). That is, Salgado’s objects are returning to a premodern state through being bluntly presented the primitivism of their cultures, the recognizable historical images of lifestyles, productions, and customs. Such integrity of time and space can lead to abundant historic contexts, in which audiences can appreciate the Wauja people with a full picture as if they swirl and dance on an on-playing stage instead of a flat, and temporary instant of them.","Similarly, confronting such stage, where people perform in their own historical contexts, the audience may question the fidelity of reflecting authenticity in Genesis, just like what Cole regards Curtis’ work to be “beautiful but frozen characters” (14). For instance, Christopher Ball’s question that “are Xinguans (indigenous people) “literally” off the map for viewers, or is it understood that in Genesis they are merely portrayed as if they were?” (34). To answer the question, it motivates us to deconstruct and examine Salgado’s method in creating his stage.","Overviewing the Genesis, the main methodology to approach primitivism is the strategically remove subjects that interfere or blur the thematic consistency and place them somewhere out of the audience’s view. Return to the portraits of Curtis, we could relate such thematic emphasis to his removal of “an offending clock from a carefully arranged scene” (Cole 14). We may firstly verify the validity of such manipulation. In the book Anthropology and Photography, Elizabeth Edwards explained the relationship between the internal subjects and the reading audience by arguing that “material can move in and out of the anthropological sphere and photographs that were not created with anthropological intent … may nevertheless be appropriated to anthropological ends” (13). To support such manipulation, she further explained that “the defining essence of an anthropological photograph is not the subject-matter as such, but the consumer's classification of that knowledge or \"reality\" which the photograph appears to convey” (13). Relating to Curtis’ anthropological studies, apart from his intended academic knowledge, the interpretations and cultural understandings from the audience lead the way to define photos. The image of the indigenous communities is to a great extent left to the readers. Therefore, their artificial manipulations of certain subjects become reasonable under the perspective of anthropological texts.","Based on the validity of such removals, further benefits it involves could be discussed. For audiences in the common public, a remarkable significance is a theatrical effect in work. Concerning the work Qajar Series composed by Ghadirian, Melissa Heer explained that modernized objects like the bottled beverage among a scene occupied by people in traditional costumes are “anachronistic details” (4), namely, a heterogenous context of time and space. When the coherence of a photo with linear historical chronology is interrupted by certain phases that create huge chronological discontinuity, the objects representing such distinction becomes “anachronistic details”. Considering the case of the Wauja people, particularly in the scale of time, the primitive subjects within photos play as implicit anachronistic details under the audience’s cultural context and their understandings of modernity. Therefore, as he artificially constructed a realistic stage of the nature for readers to peek inside, the audiences are placed in a position to be challenged with their cultural experience, to imagine an exotic story, to focus on vital historic phases of cultures of “others”, and to virtually engage in their life.","For audiences in anthropological field, it also proves to involve capacity of academic values. Ethnographic narrative as a public historical record, whose narrators must not be merely confronted with the recorded people but for the descendants and those who would potentially become audience. In noting the anthropological dimensions of the documentary photo collections, Athol Chase as an anthropologist describes them as “a reservoir of information about their culture”, which help “to enrich the present generation’s perceptions of their own history and identity” (Chase 110). In Curtis’ and Salgado’s containers of their objects, the strategy of precisely preserving a community’s eroding image in an anthropological context does not deny a currently state of the Indian culture that is evolving through time. As Poolaw captured a woman wearing lipstick and sleeveless open-necked top wear, while Salgado portrayed hands of a tribal man in his down jacket pockets. Instead, a full picture of certain vital phases in the given community’s history, specifically premodernity, indeed is often mangled with anachronistic details such as linguistic evolutions, population migrations, and lifestyles. Thus, in terms of what a photographer can record, the unique visual figures like costumes, ceremonial events, and group activities would be more appropriate put into a performance of virtual realistic chronotype. Curtis’ characters are performing in their historically significant moments for their later generations and public audience to watch, while some comments echo with such strategy that “Curtis worked like a cartographer who reads each face a map of their own history”.","Photography is advantageous in recounting a lively momentary, while it is also a realistic canvas for photographers’ maneuvers in recreating a chronotropic phase. Between Edward Curtis and Sebastião Salgado, there resides an anthropological motivation. While reviewing certain historically significant phases through photography, they strategically design stages, where their subjects are able to freely perform their authentic images. Thus, their dedication to representing stories of distancing communities and their cultural “museums” through research-like documentaries became possible.","Works Cited","Ball, Christopher. “Let There Be Light: Wauja People and the Practice of Photographic Primitivism in Sebastião Salgado's Genesis.” Visual Anthropology Review, vol. 33, no. 1, 3 May 2017, pp. 28–37., https://doi.org/10.1111/var.12119.","Chase, Athol. “‘THOMSON TIME.’” Aboriginal History, vol. 3, no. 1/2, 1979, pp. 109–10., http://www.jstor.org/stable/24045735.","Cole, Teju. “Getting Others Right.” The New York Times Magazine,13 June 2017.","Edwards, Elizabeth and Royal Anthropological Institute of Great Britain and Ireland, editors. Anthropology and Photography, 1860-1920. Yale University Press in association with the Royal Anthropological Institute, London, 1992.","Heer, Melissa. “Restaging Time: Photography, Performance and Anachronism in","Shadi Ghadirian’s Qajar Series.” Iranian Studies, vol. 45, no. 4, June 2012, pp. 537–48., https://doi.org/10.1080/00210862.2012.673829."]},"txt-12":{"title":"Into the Deep Canyons: Rethinking on Georgia O’Keeffe’s Works","paragraphs":["In her essay “Georgia O’Keeffe’s Radiator Building: Gender, Sexuality, Modernism, and Urban Imagery,” Vivien Green Fryd revisited and closely examined O’Keeffe’s early works by integrating several contemporary critiques focusing on gendered readings. To present sexualized interpretations, she employs the argument of Anna Chave, who explained that O’Keeffe depicts her experience of body and desire in an abstract way through “voids, canyons crevices, slits, holes, and soft, swelling forms” (Fryd 282). Even further, Fryd suggested the painter’s unique femininity of expression is explained through Freudian terms by one of her critics Helen Appleton Read (285).","The painter reviewed by Fryd is one of the most prestigious painters in the 20th century, contributing to abstract paintings in her early times. The first time I saw her work was on a random trip to the Museum of Modern Art. It was in gallery 509 with a theme of the New York City of its 1920s. Her painting Abstraction Blue humbly appears as it is dominated by undulating swirls and curves of blue tones. Just like Kazimir Malevich jokingly placed a white square on white canvas, I realized how the simplicity on the surface might hide specific intents of O’Keeffe. Reading through Fryd’s essay, I was surprised to find how Anna Chave precisely and convincingly interpreted them as objects like peculiar voids and holes while Read related them to serious Freudian context. Drifting in the blue waves, my uncertainty was finally replaced by such convincing definitive explanations. However, definitions are arbitrary sometimes. As such contemporary critiques all surprisingly lead to a similar direction: sexualization, I doubted whether these one-sided interpretations of time are telling the whole story.","Coincidentally, this doubt was further confirmed while I picked up the book Seeing Ourselves: Woman’s Self-Portraits by Frances Borzello in library stacks. In her book, Borzello discussed around a tracible historical development and abundant sources of self-portraits of women. Following a chronicle lens, a portrait of a nun on religious manuscripts in the 12th century marked a threshold for women to portray themselves (Borzello 23). As time moved, after an insignificant periodic evolution in forms of such art, she emphasized on the 20th century, where such self-portraits developed into more complicated forms, even presented through sculptures and photography. Borzello argues that they are not only reproductions of artists but linguistic tools for them to deliver ideas (19). It seemingly suggests that the minds behind these portraits determine their forms. In other words, the underlying ideologies determine how they look like. For example, the portrait of nuns reflects the self-awareness among ideas of the Renaissance. Meanwhile, a sculpture symbolizing the female sexual organs by Hannah Wilke delivers a feminist challenge against the subjective position of males.","Thus, instead of merely a name in the wall text, O’Keeffe was introduced to me again as a prevailing figure in 20th century feminist arts. Related to arguments in Borzello’s book, as critics’ interpretations of O’Keeffe acknowledge that her paintings lead to a private expression of the painter herself, it is plausible for us to position them in the discussion within the book, the images as self-portraits of the female artists. Some might argue that since the existing critiques already peeled those figurative elements with multiple degrees and confirmed how they played as a representation of O’Keeffe herself, an additional discussion is a redundancy. However, the flowing curves are deceptive for reading. Although several grotesque artworks stood as","dominance while paintings of O’Keeffe were relatively moderate and even unimpressive, it does not mean her simplicity strategy would eliminate capability of delivering complicated ideas. Indeed, through further research, I learned how such implicit expressions had been misinterpreted by a popular theory and labeled as inappropriate by contemporary critics. At the same time, I found a promising direction to answer my question.","Peg Brand’s discourse may enlighten us in finding a distinctively different way beyond the dominant interpretations to see O’Keeffe’s works. Named after its title, “Feminist Art Epistemology: Understanding Feminist Art”, this framework is structured to adjust public misinterpretation and ignorance of feminist art and help form a more appropriate reading by analyzing the rhetorical devices within the works. A circumstance is set as a premise to explain the cause of the existing bias. Brand explains, “these differences in tone and characterization are troubling indicators of trends in art writing that routinely valorize the work of male artists and minimize that of women” (171). It refers to existing discrimination of women’s art in art critiques. Then, she further describes how female artists responded to this gap of preferences and the male authority. In rebelling against it, female artists are making a “contrast to male artists who openly and proudly invoke pornographic depictions of women within the art world hierarchy” (Brand 175). Meanwhile, “subject matter depicted by women, like that of man, can vary widely” and “this can sometimes diminish a viewer’s experience” (Brand 165). Following such stages, as the subversive feminist art causes bias and misinterpretations of viewers, their potential intent can only be revealed through examining their rhetorical strategies behind.","Considering the case of Georgia O’Keeffe, Brand’s observation of the prevailing inequality in art writings towards male and female artists properly explains why the intertwined curves and contrasting colors in O’Keeffe’s canvas were often superficially interpreted from a sexualized perspective. Besides, Brand’s awareness of the deceptiveness of such a form of art helps to find an entrance, motivating the audience to dive into these works and to research for potential advocacy. In other words, it may be plausible to similarly dissect her paintings due to people’s misinterpretations of them.","In Fryd’s essay, after presenting critiques describing “what these objects are” in O’Keeffe’s paintings, namely casting gendered definitions on certain parts of the work, she further employed reviews that help further provide answers of “why these objects are depicted in such way.” A potentially possible intent of the painter is thus concluded, as Fryd gives that both in her paintings and real-life activities, “O’Keeffe thus assumed a masculine position” (287). With such an assumption in the context of drawing, O’Keeffe replaced elements considered as female characteristics with ones that symbolize masculine genius and power (Fryd 286). As objects in the paintings are regarded as expressions of her own desires and experience while at the same time being categorized as something that delivers masculinity, she seems to be acting the role of a male.","No doubt, such interpretations with potential are worth considering, especially combined with the widespread influence of Freudian theories in her contemporary. However, as Borzello claims in her book that as works created by female artists were born with all sorts of flourishing ideologies, the minds behind the canvas should not be ignored. Hence, though the gendered interpretations enlighten the works, the thick veil on canvas may not be fully uncovered. Considering Brand’s essay, the role of uplifting, subversive feminism was decisive in the formation of such works. Then, under a feminist context, we may find a new scope for interpreting O’Keeffe’s works. In noting that visual images can direct to multiple readings and thus produce an opposite, Brand writes, “parodies can be read mistakenly as acts of adulation—imitation as the sincerest form of flattery” (182). That is, giving the example that a parody used in female art may be considered as a flattery imitation instead of mockery by duplication. Similarly, merely through a psychoanalytic dissection, the true colors behind might be overlooked, as the male role, which this American female artist was assumed to play, is also a misguided conclusion.","Among these early paintings, the idea of avoiding the objects of male desires is distinctively significant. Neither from the best woman face as described by her predecessors nor an imperfectly wounded body portrait painted by her contemporaries, she decided to use those graphic elements to represent herself. Admittedly, the significance of one of her critics Anna Chave’s readings undeniably offered us room for imagination by deciphering those waves and radiations as symbols. It may be doubted that such imagination was and should have been developed from comparing female sexual organs due to the similarity in forms. However, these particular objects sharing a common quality can also be found in her later works, which were merely landscape paintings. Such specific quality is delivered in one of the later works Black Hills with Cedar, which was completed in an isolated workspace in Abiquiu, New Mexico. Somewhat inconsistent with their natural state, the siltstone hills with broken, chopped edges are portrayed as a cream cake with rolling and softly undulating surfaces. Apparently, if those abstractions are understood as representations of sexual organs simply because they are considered as self-portraits of O’Keeffe herself, then it is unreasonable to apply such one-sided notions in viewing unrelated landscape depictions. Thus, opposite to the interpretation of those critics, we then can conclude that these symbols link to no references to sexual implications but a language of her delicate femininity.","Based on Brand’s example of how a parody would be misinterpreted as flattering, I argue that instead of the conclusion in Fryd’s discourse that O’Keeffe played the male figure through paintings, O’Keeffe’s works are indeed an excavation and subversion of it. Although they refuse to be desired objects, these abstractions are not becoming distanced from the audience but closer to them. She took away the frame, the distance between painters and the audience, and invited them to directly use her own eyes to enter and observe her world. Meanwhile, this particular strategy also presents its subtly in another way. Evan a step further than those self-portrait on belongings like bedrooms, like what some of the early female painters did in Borzello’s book, O’Keeffe’s self-portraits are thus abstract at a higher level. While it signifies her peculiar artistic language, it also emphasizes more robust defense against the established patriarchy in the art field. Separated from a realistic image of herself, they reduce the possibility of being unequally treated by an audience who only appreciates painters’ work through their identity.","Despite her efforts, we still observe crowds of gendered misunderstandings at her time. As an audience for almost a century later who is able to be an observing outsider of that trend of the times, I realized that specific readings towards her devotions to the field should be reconsidered, as we could set aside outdated prejudices by detecting the other half covered story.","Those curves with colorful tones in gallery 509 may be humble among their peers’ brilliance, but their voice is worth being carefully listened to when lights are shed on them."]}},"galleries":{"p1":["assets/2025/paf 2025-06-27 180946.095.jpg","assets/2025/paf 2025-06-27 181519.473.jpg","assets/2025/paf 2025-06-27 184635.748.jpg"],"p2":["assets/2025/IMG_3552.jpg"],"p3":["assets/2025/grdr 2025-06-20 145130.571.jpg","assets/2025/grdr 2025-06-20 145017.090.jpg"],"p4":["assets/2025/ili-nalati.jpg"],"p5":["assets/2025/000003copy.JPG","assets/2025/000024copy.JPG","assets/2025/000026copy.JPG"],"p6":["assets/2025/IMG_0745.jpg","assets/2025/IMG_0748.jpg","assets/2025/IMG_0746.jpg","assets/2025/IMG_0743.jpg","assets/2025/DSC_1862.jpg","assets/2025/DSC_1890.jpg","assets/2025/DSC_1879.jpg","assets/2025/DSC_1894.jpg"],"p7":["assets/2025/Snapseed 2.jpg"],"p8":["assets/2024/Snapseed 4.jpg","assets/2024/Snapseed 5.jpg","assets/2024/Snapseed 6.jpg","assets/2024/Snapseed 3.jpg"],"p9":["assets/2024/000004670002copy.jpg","assets/2024/000004670003copy.jpg"],"p10":["assets/2024/grdr 2024-10-12 163546.798.jpg"],"p11":["assets/2024/IMG_5838.jpg"],"p12":["assets/2025/15300020copy.jpg"],"p13":["assets/2024/grdr 2023-06-10 085753.095.jpg","assets/2024/grdr 2023-06-10 090647.163.jpg","assets/2024/grdr 2023-06-10 141648.980.jpg"],"p14":["assets/2024/grdr 2023-12-3
