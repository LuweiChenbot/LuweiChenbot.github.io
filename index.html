hantomized Spiral","year":"08"},{"id":"txt-9","title":"The Case Against Museums","year":"09"},{"id":"txt-10","title":"The Power of Invisible Images","year":"10"},{"id":"txt-11","title":"Communities On the Stage","year":"11"},{"id":"txt-12","title":"Into the Deep Canyons: Rethinking on Georgia O’Keeffe’s Works","year":"12"}],"photoIndex":[{"id":"p1","title":"Daydream","year":"2025"},{"id":"p2","title":"UNTITLED","year":"2025"},{"id":"p3","title":"Klamay 克拉瑪依","year":"2025"},{"id":"p4","title":"Ili 伊犁","year":"2025"},{"id":"p5","title":"循環的夜","year":"2025"},{"id":"p6","title":"Barragán's House","year":"2025"},{"id":"p7","title":"Museo Tamayo","year":"2025"},{"id":"p8","title":"粗野主義與貝爾格萊德","year":"2024"},{"id":"p9","title":"Grace Farm","year":"2024"},{"id":"p10","title":"野口勇的遊樂場","year":"2024"},{"id":"p11","title":"沙漠玫瑰","year":"2024"},{"id":"p12","title":"大學站","year":"2024"},{"id":"p13","title":"五台山寺","year":"2024"},{"id":"p14","title":"金閣寺","year":"2023"},{"id":"p15","title":"鹽花","year":"2023"},{"id":"p16","title":"SEAGULL","year":"2023"}],"articles":{"txt-1":{"title":"Comments on Yi Yi by Edward Yang","paragraphs":["In a long, fixed shot, we are presented with Minmin crying about the blandness of daily life before her dressing mirror. The trembling mirrored figure seems to amplify the emotional outburst, as we can clearly feel the outpouring cries of sorrow that almost drowned out the fragmented words like tumultuous floods. Moments after, an anonymous perspective outside of her room depicts the silently weeping Minmin through rows of shutters contrasting with reflected images of flowing traffic sliding over the window like scattered meteors. Throughout this scene, although the humble existences of glass and mirrors are obliterated by their reflexivity or transparency, we could not deny their faintly awareable interactions with characters. Such subtleties with a consistency throughout the film seem to be achieved through a stylistic type of mise-en-scene enabling significant framing and an emphasis on spatial elements.","In the book The Oxford Handbook of Chinese Cinemas, James Tweedie examines the cinematic work of director Edward Yang, a critical figure in the Taiwanese New Wave movement beginning in the mid-1980s. James Tweedie argues that material objects of mainly urban buildings and lanes in Yang’s realistic compositions manifest lateral aspects of zeitgeists of Taipei in Yang’s time (5). By analyzing Edward Yang’s film Taipei Story and The Terrorizer, he puts that “Yang’s work, …, deploys the reality of the cinematic image to document the elaborate staging of contemporary urbanization and globalization (5). However, while the materiality of Yang’s films directly substantializes the concept of urbanization by images of urban landscapes, it would only become plain observational representations unless tensions are presented between spaces and a most fundamental subject: citizens. In fact, the spatial presentation is to a large extent made up of interiors, and by contrasting the interior spaces and urban spectacle, Yang metaphorized such conflicts between individuals and urbanization. Therefore, to characterize such analogous conflicts, in Taipei Story, James Tweedie focused on Yang’s exploration of the intriguing and flowing medium between interior and exterior fields (7). Thus, the glass barrier as part of spatial components in Yang’s mise-en-scene became his target of analysis.","To understand such misalignments in Yi Yi, the critical medium of glass should be explained at first. As a modern material, it dissolves the heaviness of masonry buildings that constrain spectators’ vision and promotes a visual democracy through its nature of transparency. In other words, they remove huge, impeding shades of building blocks, allowing a broader conception of surrounding landscapes. Such false spatial demarcation transforms dense, hive-like office buildings from airtight, impenetrable cages into freely approachable containers, communicating domestic and public fields. As a result, urban landscapes are thus inwardly enlarged by including diverse interiors perceived through glass walls. Specifically, contextualized by Yang’s cinematic language, such inward noticing might be characterized as intrusions into private realms and enforces a public display of characters’ internal intricacies. For several scenes, the director strategically frames the characters through store windows, being unaware of the camera, engaging in conversations. It is the nature of such transparency that it caters to spectators’ voyeurism, namely, peeping into the spaces spatially and emotionally distant from them. Thus, parallel to the experience of television watching, the audience views the staged scene through a concrete box with a glass display at full communicativeness. Meanwhile, for such pieces of subtraction of civil life from entire life trajectories of characters, Yang employs extremely long takes to help emphasize stillness and recurrence. His refusals to insertions of cuts ultimately motivate us to experience a realistic, lower-than-expected pace of mundane life fully. Slowly proceeding forward, despite being separated by an entire glass shop window, we straightforwardly encounter them and virtually participate in their intimate conversations, which are recorded as part of the diegetic sound. With such a nature of liquidity, therefore, the dialogues between spaces become visible to the audience.","Admittedly, I realized as we audience curiously partake in their life experience through watching, the medium of glass thus contributes to the character’s isolation by allowing transparent comparisons between individuals’ experiences. No matter how intense and lively, their circumstances are all compressed into images of urban spectacles. Dully repetitive squares divided by window frames bound the characters’ figures, indicating a homogeneity of life experience among urban citizens. Notably, Yang demonstrates a more objectified instance signifying such transformation by surveillance cameras with screens of several perspectives for monitoring. When Popo returns home from the wedding celebration, her image is precisely displayed through digital monitors and moves through each view. A similar presentation also occurs on the screen when Yangyang returns to school. Consecutive spatial travels are framed as simultaneous projections to a single surface, exhibiting themselves for spectators off the screen. Hence, Yang’s mise-en-scene achieved a symbolic compression of space, preparing for a premeditated confrontation of individuals and the metropolis.","If spectators’ interventions are merely silent, neutral observations, then the intense subversion of the internal realm of characters is in fact precipitated by a larger subject, namely the modernized Taipei city, about which Edward Yang deploys his film as a pedagogical medium to illuminate and criticize. It is another nature, the reflectiveness, that creates convenience for the intrusions. As glass facades reflect images of surrounding urban spectacles, reflected images are multiplied, creating illusions outwardly. Similar to cubist paintings revealing the full picture of objects in an intuitive way of conception, the fragmented urban images bound back from glass walls despoil our rational thinking and trap us in an endlessly repetitive space. Composed entirely of apartment buildings and infrastructures with heterogeneous, indistinguishable appearances, the urban city, specifically Taipei in Yang’s film, is remapping our sensual orientations to the surrounding environments.","Specifically, Yang articulated such disorientation in a scene where Minmin experiences an emotional breakdown and starts a monologue. It begins with a fixed shot introducing how NJ walks through an empty corridor and enters Minmin’s room. Then, a long take records Minmin’s monologue complaining about her confusion toward repetitive, dull trivialities of everyday life. The next moment, while the camera stayed inside the room, it faced toward the outside through a window. The screen is divided into two parts, with a quarreling couple presented through their figurative projections on the curtain on the left and concrete lanes swarmed with traffic and buildings in the distance on the other half. However, beyond a horizontal presentation of external worlds, the involvement of glass vertically expands the space with another dimension by attaching a reflection of Minmin’s room. Thus, despite the glass physically separating domestic spaces and the external world, their images collide and intersperse with each other. The apartment is overwhelmed with dense clusters of moving headlights and scattered interior lighting of apartments nearby. The scene ends with a fixed shot with a similar composition, siding a window perspective of Minmin’s bedroom with urban landscapes. For the audience, a series of parallels are apparently marked, Minmin’s whimpering sobs were inundated by chaotic traffic sounds and neighbor’s yelling while the interior illuminations are surrounded by numerous neighboring ones. From this scene, it marks an archetype of contrasts of private spaces and urban landscapes.","Regarding Yang’s fascination with such spatial interactions, Tweedie suggests that instead of merely presenting basic perceptions of locations, Yang’s images of exteriors blur the lines between inside and outside by compressing different surfaces onto a single plane (9). That is, Tweedie emphasizes a flowing and obscure spatial boundary through his explanations. Based on his idea, I suggest that although Yang intends to exhibit Minmin’s bedroom as a central subject within the focus, he dramatized and normalized it as one of the repetitive urban spectacles through comparisons. Indeed, his stylistic camera language explains it. Throughout the film, fixed, long shots with an anonymous perspective are employed with extreme frequency. Counterintuitively, such preference remains even when emotionally explosive or intense scenes occur. For instance, Popo’s accidental emergency is announced from a long shot, where the spectators can perceive nothing about characters’ expressions but distant conversations. Similar sensual detachment occurred when neighbors’ quarreling was unveiled through silhouettes and sounds. By stepping backward to fully observe an incident, these shots deliver a sense of objectivity and calmness. Yang’s sensitivity to spaces enables his mise-en-scene to be framed as a square box of omniscient viewing. Instead of adopting an indifferent and numb attitude to ignore life vicissitudes, it removes constraints of domestic viewpoints and encounters the incident with a more rational, and sensible decentralized perspective, evoking profound reflections. Thus, as the boundaries between domestic realms and the external world are dissolved and blurred through glass walls, the audience could recognize that NJ’s family is not an exception within modern society but one atomic participant within the giant social order.","As spatial images interact on a single surface, announcing individual segregations, it leads to a question of the substantial aspect of private spaces. Are the personal realms infinitely shrunken and thus being integrated into a larger social structure? Beyond figurative contrasts between the main characters and the unfamiliar, what are the connections between individual spaces in terms of the family? What else might Edward Yang argue about such spatial interactions?","Apart from overlapping characters’ figures with the fragmented images of Taipei, Yang also paralleled individual spaces, referring to life trajectories of characters, to discuss a subversive byproduct of urbanization: divergence of filial bonds among family aggregates. However, distinct from the individualization, which is articulated through graphical contrasts scattering among the film, evolutionary changes among families are closely related to narratives, although spatial elements are still the central materials. Perhaps it is Yang’s perceptions of the emptiness behind city landscapes; he hardly portrayed full panoramas of them throughout the film, with few exceptions of reflective images merely containing blurry, dimming contours and countable dot lights. Rather, he focused on a series of specific functional architectural spaces that symbolize containers for narrative purposes, including hospitals, hotels, office buildings, and urban infrastructures. As these spaces as stages are assigned to landmark incidents of individual and familial life, their narrative significance condition themselves as frameworks upon which the event-centered scenes connected and fabricated the narrative structure of the film. They are constituted as individuals’ private realms, documenting their significant growth. For instance, Tingting and her friend Lili’s love affairs are closely tied to the overpass, under which she confessed and engaged in tense conflicts. Meanwhile, NJ’s accidental encounter with his lover and Adi’s wedding celebration happened at the hotel. Meanwhile, it seems the director designed such metaphorical spaces of characters as recurring motifs, suggesting impending role-specific events in scenes interlacing without strong causality in the entire non-linear narrative. In such spatial narrative, a traditional linearity is replaced by various coincidental and intersected moments. As a direct result, the degressions of family are materialized by characters’ private spaces being independent of each other.","However, the seemingly fatalistic, irreversible individualization might not be the whole story in Yang’s context. The individuality of both characters and spaces might be deceptive in his vision. In “Concentricity, Teleology, and Reflexive Modernity in Edward Yang’s Yi Yi,” David Leiwei Li proposes that, in negotiating the continuity of traditional ethics amid the rising globalization, Yang represented the deconstructions of family and decentralization of individuals but conveyed no sentiment on them (3). Li deployed the disconnected intergenerational bonds and blurred boundaries of domestic and public areas to claim that the centripetal forces of “local forms of community” were not declined but drifted and blurred (10). In other words, the centripetal forces, familial and social relationships, under the East Asian context still survive in a polarized way amid the modernization in the narration of Yi Yi. No doubt, Yang’s ambivalence between the prevailing individualism and a remaining affinity cohesion in Taiwan society is apparently articulated in the scope of film narrative: although Popo’s remaining silence, resulting from a severe coma, played as an absence of absolute authority in traditional family aggregates, recurring scenes, in which family members confessed to her, signify an undermined, domestic centripetal forces.","In terms of spatial constructions, such ambiguity is potentially embedded in Yang’s intriguing mise-en-scene. I suggest the focus on bounded, interior spaces along with individual characters is not simply a consequence of Yang’s deep pessimism over the emptiness and uniformity of urban structure but his interpretation of decentralization. Spaces that situate individual circumstances are “non-spaces,” independence of specific spatial and temporal conditions. That is, being prohibited from surveying from an exterior perspective, they are identified as isolated stages either being arranged for upcoming events or becoming deserted without posthumous life. In other words, as other similar architectural spaces are to be located numerous in Taipei, the specificity and significance of those shown in the film are given by incidents in relation to characters’ life trajectories rather than geographical identifications.","To exemplify, several scenes frame an implicit juxtaposition of the figures’ personal episodes. For physical spaces with an ongoing event, there are often supporting roles, although such recognition is temporal and respective to the centrality, sharing similar courses of life. For instance, in the wedding celebration, nuclear families, like Jian’s, indicate a “future tense” of the protagonist Adi, who is on his way to start a family; in another scene displaying Minmin’s office, she and her colleague shared memories of temporary escape from secular life. A more evident illustration may help validate Yang’s subtle practices if such observations are perceived as rigid misunderstandings. Regarding a romantic relationship, the director paralleled the NJ and Sherry and his daughter Tingting and “Fatty” by deploying a cross-cutting that connects both events. Other than illuminating a simultaneity of time, both events seemed to be positioned in the same space, a crosswalk. Hence, drawing from Yang’s presentation, the spectators might perceive an underlying filial integration woven by the consistency of life encounters among the family. It might potentially subvert a conceived spatial construction of the characters’ individuality. Still, from another perspective, it seemingly refers to a possible existence of the enduring, interpersonal bond that Yang aimed to explore through the film Yi Yi.","Yang’s contemplations of Taipei city had never been a false binary between a mere sentimental, culturally inherited nostalgia for irreversible past or a gleaming depiction of the postmodern city with flashy neon and consumerism as social spectacles. In his horizon, architectural spaces as a physical medium of human activities alienate, exhibit, confine people. Fundamentally, it is the overspreading expansions of the modernized, commercialist-oriented archetype of urban construction that transformed the vicinities into extremely repetitive and hollowing duplications of functional architectures. These birdcage-style buildings with glass facades and steel structures thus conflicted with local communities where a traditional ethical paradigm was yet dissipated. Hence, it eventually induced a thematic, fundamental question of the urban residents as well as Edward Yang, as Minmin mentioned, “I have nowhere to go.”","Work Cited","Jameson, Fredric. Postmodernism, or, The Cultural Logic of Late Capitalism. Verso, 2007.","Li, David Leiwei. “Concentricity, Teleology, and Reflexive Modernity in Edward Yang’s Yi Yi.” Globalization and the Humanities, Hong Kong University Press, 2004, pp. 249–72. JSTOR, http://www.jstor.org/stable/j.ctt2jc6wg.16. Accessed 1 Mar. 2023.","Tweedie, James. Edward Yang and Taiwan’s Age of Auteurs. Oxford University Press, 2013."]},"txt-2":{"title":"A Study on Yoshihiro Tatsumi’s Manga","paragraphs":["In his work Abandon the Old in Tokyo, Tatsumi offers a living presentation, where characters can be depicted in a more realistic perspective rather than extrapolating to dramatic films. Particularly, characters’ facial expressions in Tatsumi’s work convey emotional complications based on expressionist nuances. Despite the fact that the protagonist’s facial portraits are presented in a rather simplistic way, where recognizable features are merely brows, eyes, and the mouth, and sometimes appear to be stifled or robotic, they do deliver subtle changes amongst the stories. It seems that there are similarities between portraits of figures in Tatsumi’s work and those in Yasujiro Ozu’s films. In Ozu’s artistic presentations, his characters are often considered to share certain identities with roles in Noh plays. That is, the characters seem to put on masks shielding dramatic emotional presentaions.","However, in these two artistic solutions, characters’ facial expressions might not simply function as symbols that orientate the audience to a fixed, typical understandings of certain emotions. Considering characters’ performance in theatrical plays, it is impossible for audience to recognize details that are too subtle to be perceived far away. As a result, characters more often associate specific emotions with exaggerated, formulized signs. For instance, a wide, opened mouth with goggling eyes normally refer to astonishment. In such a way that characters’ expressions are minimalized into a conceptualized paradigm, it indicates an authorship tyranny upon which characters are subject to constraint expressions lacking realistic instabilities of mental reactions. For the audience, receiving excessive symbolic information means suppressing careful speculations and understandings of figures and advocating an instant, unconscious identification. In Abandon the Old in Tokyo, the male figure tends to be trapped in a mental state full of anxiety and uncertainty, yet combinations of precise movements of mouth and eyes suggest in different scenes.","In another perspective, close-ups in manga also function as indicators of an emphasis of character’s facial expressions. Particularly, characters’ faces in manga are quite frequently subtracted from specific spatial context and put before an empty background of either shadows or blank space. In Bela Balasz’s essay “From Theory of the Film”, she explained that “the facial expression on a face is complete and comprehensible in itself and therefore we need not think of it as existing in space and time” (276). As a facial expression naturally contains a context of itself, its self-referntial ability is highlighted by manga creation, which further intensifies reactions on characters’ faces by using strategies like narrowing the size of panel, adding extra shadow and dynamic radiating lines behind the figures."]},"txt-3":{"title":"A Study on Close-Up by Abbas Kiarostami","paragraphs":["Self-reflexivity, by its definition, means that something contains a reflection or image of itself. Considering the self-reflexivity in a movie, such characteristic might relate to a critical effect that movies create: the duality between its capacity to represent the reality and its fictionality of directors’ artifices. That is, under this context, it is due to the fact that the movie owns a certain self-awareness of itself. In Abbas Kiarostami’s cinematic solutions, the self-reflexivity in Close-Up, refers to the presentation that a real-life circumstance is represented in an artificially made. cinematic way. In Close-Up, the characters are performing in a reflective way that they are both protagonists in their life and the fictional film. Notably, when a virtual trial is staged in the movie, the characters within are all performing in an alienated realm beyond their realistic life.","The actual purposes of presenting a self-reflexivity in the movie might be self-intricacies of the director, yet certain aspects are explicitly explaining themselves. On an intellectual level, such strategy could be used to challenge a conventional form of storytelling. Compared to what are made to singularly be documentary or non-fictional, Kiarostami’s self-referential film indicates a possibility of drawing a blurring line between two parties. Through realistic documentations, it appropriates a theatrical body, and through fictional arrangements, it achieves a meta reality. However, with a political consideration, such strategy might be a conformation to the prevailing censorship on cinematic content. By resorting to a reflexive tool, a personal advocacy is to be moderately wrapped. The realistic recording delivers certain honesty, arguments for social scenes, while the fictional aspect adds a playfulness to undermine the frankness in appropriating the reality.","Whatever the subtle considerations are behind the use of reflexivity, the effects it brings to the audience provides concrete materials for a discussion of the film ontology. That is, for one part, by setting up voice-over, lengthy and seemingly random conversations, and tactically positioned close-ups for characters, the fictional aspect of the trial is veiled, convincing the audience how realistic that is to be. For another, the honesty of documenting is suddenly broken down by an unveiling of the director himself. The ambiguous boundary between reality and fictionality is such presented throughout the film. Meanwhile, such design also leads to a fluidity of characters. In the last scene, when the soundtrack recording the conversation is made to be depleted, the audience fails to tell what is being performed while what is naturally happening.","Such interweaving of reality and fiction multiplies audience’s experience. Above how the film, based on a living story, provokes spectators’ reflections, the artificial aspect, or the poetic elements, paints the authentic story with dramatic tensions which belong to theatrical plays. Just as the voice of the rolling can never fades in my mind, the swaying bouquet of flowers stays forever."]},"txt-4":{"title":"A Study on Sunset Boulevard by Billy Wilder","paragraphs":["In the second half of the movie Sunset Boulevard, the scene happened in the studio centers on challenges of Desmond, or a conflict between two eras, the past and present (1:08:02-1:11:54). Her outdated superiority was first displayed and then gradually disintegrated. Dramatic contrasts are created by multiple degrees, and the camera language is the most intriguing one.","It begins with an exposition of the working studio with director DeMille and Norma Desmond walking into it. Her arrogant was first revealed by gestural expressions, as Desmond superciliously bluffed with her head up and DeMille nodded and bowed for agreements. Ironically, their divergent views both indicate a distracted conversation, where thoughtful DeMille wearing a fake smile probably pondered about his work while Desmond might be immersed in her plans. In the next moment, a close shot with a low angle presents Desmond sitting on the director’s chair. Here, her position is first challenged. Although the camera angle suggests her superiority, an object, the hanging microphone, suddenly entered the scene and occupied an even higher position. In response, she pushed it away with disdain. The flexible microphone seems to represent the modernization of the film industry, while Desmond, a prestigious figure living in and benefitted from the age of silent films, symbolizes the declining past. Thus, this interaction refers to a silent and powerless fight against the radicality of changes. Following down, the respectful status she conceived is even elevated, as an old colleague, who recognized her and turned the spotlight to her. The following high angle shot focused merely on a few staff and Desmond, indicating a lonely, self-centered character enjoying the dazzling spotlight on stage. Then, it is strengthened by a few medium shots capturing different groups of surprising people, who called out the same lines of her name. The same high angle then returned, where she was surrounded by the crowd.","After hitting a climax, her centrality was suddenly dissolved by switching to a level angle shot, where DeMille as the director, sharing two halves of the screen with the crowd, demanded turning the spotlight back. Following shots of dialogues also depict Desmond’s challenge. An inequality of characters’ positions is first created, as the plume on her hat partly covered DeMille’s face, enlarging her dominance of the screen. However, this figural occupancy gradually declined as the conversation continued. It is explained from dialogue information that the movie plan might fail. Desmond’s fantasy was totally deconstructed, as a staff suddenly positioned above the two, indicating a new superiority on the screen, announced the shooting should continue. Eventually on the screen, her figure shrunk to an audience watching the busy studio with a back view taking a little portion of the picture."]},"txt-5":{"title":"Comments on Uncle Boonmee Who Can Recall His Past Lives by Apichatpong Weerasethakul","paragraphs":["A solitary lamp illuminates the silhouettes of Boonmee and his family. Although it acts as a moon, it failed to keep characters from the aggressive darkness all over the screen. At a certain moment, while we took a long gazed at a family dinner, Huay’s ghost tears through the barriers to reality, joining in the conversation. Afterwards, Boonsong’s scarlet eyes abruptly break through the shadowy depths behind. The existence of monkey ghost and the returning deceased cleave the surface of reality, dragging everything into forked, chaotic streams. As the ambiguous phantoms are approaching, they subvert the calmness at night by undercurrent surge.","From Apichatpong Weerasethakul’s film Uncle Boonmee Who Can Recall His Past Lives, we experience an uncertainty among the exotic, otherworldly illusions he presents: in the summer night’s fantasy, images of eerie ghosts and presumably overt sensory impacts are vaporized into a gentle, omnipresent mist. The unknown ghosts bring no horror but a reflection on living things. This diametric shift in mysticism signals a challenged dichotomy in multiple senses, between subjects and external space and time. By deducing such counterintuitive effects, such an authorial presentation foreshadows an organic fabrication of various substances into a harmonious topic. Particularly, it is led by a consistent ideological principle throughout the film.","With regard to the film, I argue that it is the Theravada Buddhist principle of Śūnyatā whose representation to a large extent influences how visual symbols are presented and produces consequent effects. To explain why this ideological principle takes such a significant role, we should identify what kind of symbols are the targets for investigation and how they are bridged to the concept of Śūnyatā. Because we find no extremely stereotypical symbols of ethnography, like Buddha statues and bustling rafts, we are propelled to turn to the remaining symbols throughout the film: the tropical rainforests and diverse living beings. Although neutral symbols of rainforests and creatures could refer to a broad signified, they are presented in a way that gives out effects in ideological terms. The effects are thus: for the mysterious rainforest, an awe-inspiring experience is conveyed in silent interactions with the subjects; for diverse subjects vaporized as lingering phantoms in the forests, they suggest the Manu code of karma and animism. Therefore, because of their close relationship with ideological terms, the seemingly reversal in audience’s perception is thereby influenced by this regional-specific ideological factor. This religious belief fundamentally directs the organic fabrication of key elements of the film. Considering the broad context of the film, the particular ontological diagram of Śūnyatā not only explains extraordinary visual effects but further intervening in the trajectory of the narrative. In order to investigate the cohesive construction that Śūnyatā produces, I suggest a preliminary explanation of how such spiritual essence represents itself in the film.","Śūnyatā, a philosophical term, holds an ontological recognition that there is no inherent or permanent self. As the absolute continuity within oneself is denied, the self is thus a collection of interdependent, changing aspects. Such beliefs in an ever changing subjects, the ontological democracy, is represented through a primary visual product of the film: materialization of subjects. It is the materialization of multiple conceptual images of a subject into realistic ones in the film. Several interdependence images of characters are represented in a non-traditional way. We are able to see the deceased Huay, the imagined monkey ghost as one of Boonsong’s image, and white fish in caves with the water buffalo thought to be images of Boonmee at different life cycles. This concretization of conceptual images, as a result, allows coexistences of fragmented images of a subject. Their interrelationship is based on the belief of an emptiness: while the external natures demarcating distinctive boundaries of appearances is denied, an internal fluidity among subjects is established. Particularly, this recognition of the multifaceted image of the subject has effects on both depictions of characters and the film narrative.","In terms of the characters, this religious belief leads to fluctuations in one’s recognition: firmly believed demarcations of subject and space are denied. Since Śūnyatā, or an ontological democracy, is represented through the concretization of multiple unapproachable fractions of subjects, no trace of an absolute image of oneself can be found, nor strictly confined time and space can be confirmed. To analyze this uncertainty in recognition, we might refer to Anders Bergstrom’s essay, “Cinematic Past Lives: Memory, Modernity, and Cinematic Reincarnation in Apichatpong Weerasethakul’s Uncle Boonmee Who Can Recall His Past Lives.” In his work, Bergstrom put an emphasis on the film as an apparatus of reflecting memories. It is based on a recognition that the “Cinema makes present on the screen images of the past, blurring the lines between presence and absence, alive and dead” (2). For its function as an externalization of memories with uncertainty, Bergstrom gestures toward a thematic effect of the film: “the use of memory images in Uncle Boonmee pushes against such an establishment of a clearly focalized past in a flashback” (4). For such fundamental effect, the film is thus organized for a stated purpose of emancipating the undetermined temporality and subject. Thus, in Bergstrom’s term, the concretization—sculpting a realistic representation of conceptual renderings—yields an effect: although realistic images confirm the ghosts and past lives as fragmented subjects, we can no longer discern, through these intersections, the specific order in which these images exist and the exact subject that observes. Bergstrom’s terms regarding the externalization of cinema are sensible, while it leaves room for further supplementing reflections. That is, I argue that because of the produced uncertainty, further analysis should be separately conducted: an inspection of the protagonist Boonmee and a perspective among characters.","Among the main characters, the uncertainty of subjective consciousness is the blurring lines of spatial and chronological orders. The blurring boundaries is artificially painted by the director through Boonmee’s incidental yet anticlimactic encounter with the solidified ghosts in a dinner scene. It begins with an extra-long shot, highlighting the characters’ figures among the darkness. Then a long take draws spectators’ attention to the dining table occupied by Boonmee and his fellows. In the next moment, a solidifying image of Huay abruptly appeared on the table. A few chest shots depict the uncertainty and confusion of Boonmee. Afterwards, guided by character’s gazes toward the screen, Boonsong’s glowing red eyes emerged from the darkness. The suddenness is resolved in the subsequent medium shot, where characters’ conversations on nostalgic topics reclaimed the once tranquility and calmness. As spiritual images are portrayed as figures that are tightly related to Boonmee’s life, the disenchantment dispelled the assumed horror and unease. However, it would be misleading to understand the elimination of conflicts simply through characters’ emotional fluctuations, as it is staged through several substrata, external factors beyond characters’ images. For one part, in terms of space, the only overhead lighting at the dining table is determined to complicate boundaries between domestic space and external environments, when all figures transform into faint silhouettes under the extinguished light. Through Boonsong’s narration, wild beasts and ghost phantoms conquered the outside world. Thus, the destructed spatial barriers position Boonmee among human beings and natural, immaterial entities. Meanwhile, regarding the time, the reappearing of the deceased wife’s ghost foreshadows an exchange between living and the dead individuals. The concept of singular flows of time in one’s subjective perception is torn apart and replaced by a mutual, temporal existence of spirits and human beings. Thus, the coexistence of Boonmee with spirits challenges dichotomous orders across several realms, of chronological and spatial orders.","Apart from Boonmee’s interactions with surrounding characters, the uncertainty reveals itself through another visual product: the hollowing of Boonmee’s metaphysical image. It means that the absolute image of Boonmee is disenfranchised because several images, indicating his reincarnations, become interdependent figures surrounding Boonmee himself. The secular farm owner is therefore registered as merely one of the contemporary representations of himself. The film depicts the hollowing of the fixed subjectivity by presenting Boonmee’s adventure of arriving at death. His death is not a dead end but a starting point for ceaseless cycling, implying the possibility of bridging different incarnated figures by a universal causality. With deteriorating illness, instead of intensively fighting against the forecastable end, death, he began a venture into the deep forests and finally the cave. It is the causality principle that leads to this submissive choice of passing through the remaining secular world and arriving at a state of chaos and undefinitions, the beginning of reincarnation. According to the Thirty Verses of Vaishnava, life is interpreted as a trajectory that is constantly transiting like stormy streams, i.e., a recurring life. Meanwhile, in terms of figurative implications, venturing into the cave is considered as returning to the human cervix, where Boonmee’s figure degenerates into a primordial state waiting for an advancing rebirth. Hence, while the process of reincarnation is suggested by Boonmee’s adventure, or a destined return, to the cave, the repetitive transformations of life reveals the recognition of implausibility of a definite presence. From the water buffalo, the catfish, or white fish, it is hard to distinguish who represents Boonmee’s past or future lives. However, what we could firmly put is that an authentic Boonmee is collapsing and reveals a void inside. Consequently, responding to the film’s context, the palpable ghosts and humanoid beasts are not exotic exhibitions but externalized figures of an ontological democracy.","Considering the film’s narrative, the effect of concretization influences the deduction of an ethnographic history. Because the concretized images are externalized depictions of virtuality, I suggest that this capability can also innovate a unique historical representation. In his essay “The Politics and Aesthetics of Non Representation,” Issac Marrero-Guillamon, elucidates a possible answer with regard to the cinematic narratives. He indicates a consequence that “[It] results in a vitalism where the world is not given in advance, but is rather a performative achievement, continuously remade” (17).” That is, holding an openness to ontological multiplicity, Weerasethakul’s film achieves a non representational film, fabricating new, creative materials by merging existing ones. Considering Guillamon’s assertions on potentials in non-representative narratives, it helps to explain how the director presents a collective ethnographic memoir. What Guillamon argued about the non-representative content beyond existing materials is deduced from the constructive capacity of the film in Bergstrom’s context. Since cinematic images enable a materialized externalization of implied memories, such fabrication is producing a new historical narrative. Ample sources of silenced, subaltern historical materials are acknowledged and merged in a way with both retrospectivity and anticipations, leading to something beyond an honest representation: new relations and ideas are generated.","Retrospectively, Boonmee’s dream refers to a non-narrative history. The existing historical narratives are the Thai’s authorities’ purge of the Communist movement in Northern Thailand. Meanwhile, the monkey ghosts, originally guerrillas, are the propagandic term to vilify those involved in the movement. Yet, through the film’s presentation, the guerrillas are represented as realistic figures in still images along with Boonmee’s narration of a dream scene. Different from the uncertainty caused by the blurring of reality and illusions previously, the concretization here empowers the historical narrative in a way that increases a sense of participation. When the conceptual image of the campaigners is displayed, it transforms flat and silent materials, the monkey ghost, into recognizable, seemingly approachable figures.","With anticipations, the functioning element of the concretized image also explains a foreseeable epilogue of religious spirits is depicted: a twilight of Śūnyatā. Specifically, it is presented through a split of the ontological multiplicity revealed from several contrasts. In the same sequences in film, the deserted past of the northern town in the film Uncle Boonmee is displayed. In profiling political and historical narratives of anti-communist movement, the director employs still images, consisting of monkey ghosts being captured, and Boonmee’s monologue. From Boonmee’s words, the authority in the future world could compress individuals as flattened, projected images, which experience a finite lifespan instead of reincarnation. Accordingly, these two contrasts, the recurring rebirth of life and mortal images with figures of monkey ghosts in still images and previous motion pictures, suggest that the principle of Śūnyatā is eliminating. The ontological multiplicity is metaphorically disappearing.","Crossing through the chasm of reincarnation, boundaries of yin and yang, and the muddy swamp, turning into a scarlet-eyed monkey ghost, they joined in the conversation in a calm summer night that will never end. In Apichatpong Weerasethakul’s cinematic presentation, ghosts no longer convey exotic, alienated horror but become a portal through which we glimpse the code of Śūnyatā branded in the chaotic overlapping of time and space. They are rendered as spiritual materials for reflecting on a fundamental question: how we should understand the subjectivity in a state of flux and uncertainty.","Works cited","Bergstrom, Anders. “Cinematic Past Lives: Memory, Modernity, and Cinematic Reincarnation in Apichatpong Weerasethakul’s Uncle Boonmee Who Can Recall His Past Lives.”","Mosaic: A Journal for the Interdisciplinary Study of Literature, vol. 48, no. 4, 2015, pp. 1–16. https://doi.org/10.1353/mos.2015.0046.","Marrero-Guillamón, Isaac. “The Politics and Aesthetics of Non-Representation: Re Imagining Ethnographic Cinema with Apichatpong Weerasethakul.”","Antípoda. Revista de Antropología y Arqueología, no. 33, Oct. 2018, pp. 13-32. https://doi.org/10.7440/antipoda33.2018.02."]},"txt-6":{"title":"A Study on Man with a Movie Camera by Dziga Vertov","paragraphs":["Among the film Man with a Movie Camera, a theatrically dramatic and experimental cinematic work of Dziga Vertov, a strategical use of intellectual montage successfully helps demonstrate the director’s arguments centered on the contemporary life in the Soviet Union and something beyond the reality: filmmaking.","Based on revelations of a vivid profile of daily life in the Soviet Union, he draws on a realistic yet paradoxical aspect of the dominant communism: the inequality of social class. With intellectual montage, he compares the conditions of physical activity between groups of people in a set, where the general public, who engaged in simple exercises, and people with more prominent social status, who were able to work out in various clubs. Meanwhile, another set demonstrates such difference by juxtaposing a working woman clothed in earthed-stained apron with noble ladies enjoying the beauty services.","The deployment of intellectual montage also serves his depictions of the prevailing industrialization. The hurtling, gleaming metal machines, and massive, identical industrial units delivers a sense of order, efficiency, and homogeneity. Specifically, he parallels the revolving weaving machines, printers, and complicated mechanical dynamics with the surging water flows generated from hydropower stations. Hence, the ceaseless, rotating movement of machines and the flooding water carrying a similar dynamic momentum suggest the rapidity of development and production under the mass industrialization.","Admittedly, Vertov constitutes several sets of montage in different forms, in which rhythmic montage is materialized by a comparison of drying the body and wiping the window frames while metric montage strengthens a swift movement of vehicles like trains from distinctive perspectives. However, crucial thoughts toward filmmaking are otherwise by intellectual montage. To communicate the subjectivity of film, he subtly cut close-ups of human eyes along with point-of-view shots and close-ups of blinking with moving blinds. A conceptual recognition that scenes presented by the film seems to be what we experience from the physical world is thus created. However, such awareness is challenged by one of his careful design: the presence of the director among the films and a set of coherent opening and the ending. For one part, the manipulator of what we are seeing, Vertov situated a series of shots, where the director filming the scene with the camera on the spot is first shown, and a point-of-view of him is later followed. Thus, the audience is able to realize the scenes on display is the product of filmmakers’ predeterminations. For another, the indications that films are capable of manipulating the order and structure of time is concretized by the correspondence, where scenes previously displayed in the film is again represented in the form of screening in the same theatre appeared at the beginning of the film. As the representation is played in a contrasting speed, it conveys the deceptive nature of the film: what we are watching is ultimately deliberate artifices of directors."]},"txt-7":{"title":"Surrenderers of Symbols or Imaginative Creators","paragraphs":["Sitting with his open palms, little Tom eagerly awaited an object to fill in his grasp. His mother passed him a gross plastic model, informing him of the name, a red car. However, the harsh parting lines suggested its recent emergence with an arbitrary shape and meaning into the world, much like Tom himself. From the second half of the 20th century, thousands of plastic manufacturers launched their pipelines, like the birthplace of Tom’s car model in Moirans-en-Montagne, France. With its transcending molding capabilities and cost-effectiveness, this promising material once evoked a public obsession, bringing itself into industries like toy production.","Reading about the alluring history of this groundbreaking material, I fell into a single narrative perspective, where I found myself fully convinced by its revolutionary nature. Yet, one of Roland Barthes’ essays pulled me out and motivated me to reflect on the other side of the coin. In the essay “Toys,” he emphasizes the concept of French toys. He compares plastic toys that are “reduced copies of human objects” to toys that he appraised as “invented forms,” like wood blocks. To investigate distinctions between these two categories, he deconstructs, interprets, and analyzes them through multiple perspectives like metaphorical meanings, materials, and ideological values.","Regarding the form, Barthes interpreted certain French toys as replicas of the adult world related to something “always entirely socialized, constituted by the myths or the techniques of modern adult life” (1). He further suggested that such socialization made a child “can only identify himself as owner, as user, never as creator” (Barthes 1). In contrast, he regarded creative toys as something that reveals no fixed prefiguration but helps culture children’s minds of creativity (Barthes 2). From such a contrast, I realized how the sculpturing ability of two categories of toys to the children’s development could be distinctively different. However, I still wonder what determines them to be either “demiurges,” kids creating things on their own with pleasure, or “stay-at-home householders,” kids passively being taught about an existing order. In other words, as a series of plastic toys that create an imaginary world for children. How the nature of prefiguration influences children’s perception and subjectivity remains unexplained.","Perhaps a plausible answer lies in works examining children’s interaction with external objects. The book Ecrits: A Selection is a collection of Lacan’s psychoanalytic theories, mainly researching the unconscious mind and languages. Notably, Lacan proposed the term “Mirror Stage” as a critical phase during the formation of children’s subjectivity. He described a scene that “The child … can nevertheless already recognize as such his own image in a mirror,” while it serves “as an identification, …, the transformation that takes place in the subject when he assumes an image” (Lacan 1). It suggests that children would establish a basic, subjective concept of “what he is” by realizing “what he is not,” after they recognize the differences between the image of themselves and those of others, the surrounding objects. Then, imaginatively, piecing that reflected image and the surroundings together, the child gains a collective understanding of himself.","When their subjectivity has not yet fully defined, toys with attractive appearances and colors become a primary source of surrounding objects for children. As games start from the tip of his nose and a mirror is usually absent in the playground, it pushes children to seek self images in role-playing scenes, where virtual scenarios are acted out. Perfectly handling a miniature car or animal model, the children emerge in an imaginary world of different characters, events, and spaces. For instance, rather than a child maneuvering his whizzing car through landscapes made of bricks, a child now becomes an adventurous driver with the power of imagination.","However, that imagined ego might be differently constructed in each scenario. On the one hand, plastic replicas are often disguised in the way of exclusivity, though their eye-catching appearances vary. Each toy, similar to how they are molded, symbolizes a single meaning, producing predetermined rules of playing while prohibiting others. The children, as a result, are passively forced to engage in games contextualized by a giant narration of adult society irrelevant and bizarre to their childhood fantasies. Once the children get familiar with them, their life quickly ends. Replicas as tributes seem to be offered and subject to their little owners. Still, counterintuitively, once the enthusiasm for creation dies, children are gradually becoming insatiable consumers of them, who in turn enslaved and shaped them.","On the other hand, Creative toys are atomic components of children’s imaginary order, extremely plastic or sculpturing. Each piece of them motivates children to attribute specific identification. Otherwise, it is barely left as a blank sheet. Thus, conversely to those tributes, brick sets and their creators attain an equal relationship. Children as subjects bring them alive, and they train children’s critical thinking and problem-solving skills when designing games with rules derived from imagination. Still, I realized such an explanation merely lies on the surface, which reads toys’ appearances.","When Roland Barthes argued that a doll can educate little girls about household work and maternity responsibilities, he exemplified how the nature of prefiguration could socialize children (1). However, such copying might fail to achieve its intention, socialization. I do not question to what extent they can represent real-life scenarios with lifelike details. Instead, I am curious whether such reproduction can relate to social activities when they are singularly presented to the children as complicated machines without instructions. Can a girl be prepared for her maternity role simply from a bulk of plastic with humankind features?","Regarding the Mirror Stage, Lacan further put that it creates fantasies that evolve from a fragmented conception of the body image to a sense of a complete self (3). When collections of toys create such spatial identification, they construct a materialized imaginary world to help children enter the Symbolic Order, a Lacanian term. In other words, after children piece together a completely individual experience through toys, they accept a totality of social customs and rules made of symbols. For instance, nylon dresses on dolls illustrate accepted ideas of femininity, while tiny cookware sets signify the causality of household work.","Since the surroundings largely determine and structure our experience and understanding of ourselves, different forms would result in other impacts. Within the role-play, an individual toy is functioning as a specific signifier, in the form of an image, pointing to a living object in real life, the signified. However, reading from Lacan, I grasped that the nature of the integrity of the Symbolic Order implies a dependence of every single signifier on the existence of others to be functionally working. That is, they explain to each other. Such consistency might suggest empty signifiers have no connection to the real world. The values of characters like superman are manifested only through circumstances with tensions in their narratives. At the same time, the femininity of a doll is established by affirming its relative position in a patriarchal society, something that toys with mere imitations in images could not represent. Hence, individual cultural replicas create an emptiness in the Symbolic Order. Just as the ideal ego in the Mirror Stage, these toys are under the premise of being misrecognized, whose virtual order is also distorted and inaccurate.","These failed copies, each wearing a mask of adult names, not only fail to narrate the reality but also crudely cram children with dumps of hindering symbols. Referring to psychoanalytical theories as a lens motivates me to think further about the unexplained. Yet , pessimistically, I found myself vainly standing behind the high wall of structuralism and looking out. Ultimately, they are no more than interpretations from an adult perspective, and let those symbolic miniatures speak for themselves. Can children's imaginations easily be constrained by such failed copies’? I have my doubts.","Works cited","Lacan, Jacques, and Bruce Fink. Ecrits: A Selection. W.W. Norton & Co, 2002.","Barthes, Roland. “Toys” Mythologies: Roland Barthes. Translated by Annette Lavers, Hill and Wang, 1984."]},"txt-8":{"title":"The Phantomized Spiral","paragraphs":["Slowly ascending the spiraling ramp seemingly without an approachable end, I, with underutilized attention, was closely drawn toward the artwork adorning the walls. With the clearest sense, I was captivated by a continuous, fluctuating embrace of waves, where I appreciated each tiny intricacy of water: the glowing artwork in a well-curated order. That was what I imagined right after learning through the Internet that an exhibition unveiling works of Alex Katz had already begun in the Guggenheim Museum. As I scrolled through my phone, fascinating images of paintings and installations graced the screen, all inspiring my desire to plan an in-person experience.","However, by the time I stepped on that giant ramp, the previous virtual exhibition tour I took online, consisting of reviews and pictorial introductions, became ceaseless chatter that lingered in my mind. Even worse, my attention was uncontrollably conditioned: I waded through crowds only for standing before those broadly celebrated “key works”, appointed vehicles for fabricated significance. Those ghosting glimpses dancing upon canvas as well as my mind engulfed away the flesh and bones and left the barren skins of artworks, clocking my full imagination. I felt an unspeakable loss: they aren’t exquisite but correct. Later on, I realized that my experience precisely followed an ironic scenario described in the essay “The Loss of the Creature” in the book The Message in the Bottle: How Queer Man Is, How Queer Language Is, and What One Has to Do with the Other written by Walker Percy. He described a tourist measuring his pleasure and satisfaction toward a site by the degree to which it conforms to the preformed complex (Percy 47). In other words, the preformulated ideas of an object, mostly in pictorial and textual forms, appropriate itself and became what the tourists are encountering. A confirmation based upon mumbling, predetermined knowledge is thus demonstrated while an experience of the thing-in-itself is veiled and denied. Concretizing what is referred to in Percy's text, the performed complex of artwork is thus reproduced images and profiles of an exhibition circulating on social media. The conceptual depictions of artwork that predetermine the audience’s experience are worth being examined, if not to be blamed, as their usurpations eliminate solid aesthetics of artistry crafts behind the appearances. Consequently, through such appropriation, these perfect counterfeits become haunting phantoms, representing an untainted, conceptual image of the original pieces and capturing spectators’ sovereignty over the realm of autonomous discovery.","Although Percy criticized the alienation of objects’ formulated images from themselves by the preformed complex, tourists’ priorities for confirmation of authenticity are not fully explained. Particularly, while available rebellious means for revisiting the essence of objects are variably enumerated to resolve such misidentification, I am confused about what quells their inner turmoil and curiosity upon their initial encounter. Is such inclination an innate nature or a constituted consequence? In my quest to figure out such sensory misguidance at Guggenheim that overtook me at the moment, the medium upon which the chattering of artwork representations circulates and prevails seems to offer indications somehow: the Internet. Since the web-like Internet generating such connectivity fails to avoid redundancy in its own structure, intertwined links indulge reproduced, identical messages.","Indeed, in Jenny Odell’s lecture “How to Do Nothing”, the effect of conditioning is somehow confirmed. She explains horrible scenes of certain chattering by describing how waves of economically incentivized information are disturbing her as a person who lives in a human, bodily time (Odell 29:10-29:25). In other words, her cognitions and perceptions became direct targets of overwhelming chattering online. On the inflating information, she puts that the issue with news consumption is not just about quality but speed and attention span, which are seemingly interrelated (Odell 28:27-28:39). In this regard, our capacity of concentration is eliminated with the dramatic increase in informational circulations, as our bodily cognition is determined to be not compatible with the inhumane pattern of mechanical reproductions. Odell’s term points the constituting effect of the Internet to intrusions on an inner, physical level. While a disordered bodily time as a byproduct of repostings online is indicated, how the disturbed physical order is realized remains unexplored in Odell’s text.","Notably, it is concretized by another similar concern raised about the distortions of individuals’ realms. Among all physical factors, Timothy Wu in his book The Attention Merchants pointed toward the attentional life. He described that we are passively distributing our attention in all sorts of corrupting activities, expanding the periphery of unsettling sources from external provocations to those activities we autonomously perform. A critical factor that advances such reconsiderations, therefore, is the conditioned attentional life. Wu argued that it motivates us to scour for scattered and interrupting breaks in their entertainment and even contribute to commercial interests (2). Considering implications of such attentional reconstruction, while a prolonged concentration is constantly severed by random popping-ups grasping our focus, the unpredictability of which allures us, creating a sense of traveling by turbo drops on an infinitely high tower. However, as the temporality of these shifting moments further slice the attentional span, it plausibly suggests a termination: we are drowning in a fluctuating stormy wave cramming itself with appealing and sensational triggers of news, thereby further experiencing a depleted granularity of sensitivity and an inflating anesthesia. Parts of the message that are worth reflecting on are engulfed by an obsession with attractive and appalling appearances.","Thus, Percy’s fable is explained here: we might be able to interpret tourists’ distorted submission and fascination with superficial, conceptual appearances instead of realistic truths within the objects. With distributing our attentional life and untainted perception to scattered, neon-like gadgets online that stimulate our bodily senses, we are accustomed to evaluating conceptualized, symbolic meanings, since the admission tickets for participating in them cost merely instant glimpses. Thus, as Percy argues, photographing the moment, rather than directly experiencing it, prevents the sightseer from truly confronting the thing being observed, an honest encounter is surrendered to blindness (47). However, apart from external sources that overmine our capacities, we are meanwhile becoming accomplices. When such false engagement with certain objects is externalized as our immediate response to an encountered artwork, photographing it, the mechanical reproduction is deceptive enough. Replicated images are considered tokens of participation, a plain response like tapping the like or repost button. Notably, they so faithfully preserve the appearances of original pieces that we are oblivious to the incompleteness of such experience. Hence, if it were not to be regarded as a consequence of humble observational ecstasy and not leads to a contemplative visit, what are the distortions behind such conceptual, pseudo-representational images?","For those artistic crafts, such reproductions might indicate a deprivation of authenticity, though they might represent a silent comment of spectators with their most honesty to preserve that instant sensual impact. The staging Art Basel in Hong Kong offers living articulations of how people intensively invest in such convenient replications as primary ways of participation. Above the thronging crowds, interspersing cameras in the air form a picturesque order. Installations with mirrors are normally crammed with faces partially covered by cameras. Paradoxically, overwhelmingly reposted images introduce the art fair, yet I know nothing about it, no textures of paintings, no layering of brushstrokes, and no depths and shadings of art installations.","Meanwhile, apart from such direct compression of physical parameters, it somehow implies an implicit reduction: an authentic presence. When the advent of social media enables information to be encapsulated within recordings, video clips, and images, it propels a stirring foresight of hyper-communication that involves a mythical truth, representing reality more authentically than messaging in texts. However, this innocent motivation, engaging in reality through multiple layers of duplications of which, might be detrimental. In Walter Benjamin’s book The Work of Art in the Age of Mechanical Reproduction, he articulates that the social foundation of the reduction of aura, or the loss of authenticity, is due to the public consciousness to bring things ‘closer’ spatially and humanly (56). According to Benjamin, this desire derives from a strong public aspiration to intimately approach the artwork. As a result, such an impulse of promoting a public mobility of works of art removes their previous pedagogical significance and uniqueness.","Consequently, by stripping the unique authenticity and physical intricacies beneath the surfaces, these empty conceptual images stifle the integrity in exhibition as well as the halo of individual artworks. Not only the bodily time of the audience but that of the exhibition is deformed. The online profile of the exhibition, consisting of reproduced images, is similar to bits and pieces on social media, where adjacent posts are mumbling irrelevant stories. Therefore, when the authenticity is gradually dissipating, the reproductions seemingly forecast the deconstruction of the Guggenheim Museum’s narrative ramp, whose skeleton is laid in all its bareness.","However, the humanistic spirit in Percy and Odell’s texts provides inspiration to restore the giant ramp in Guggenheim Museum under the franticness of the Internet. For one part, instead of a detrimental act, the immediate reaction, photographing, might be employed as an appendix to the observation. Since photos preserve a temporal, timeless image of the artwork, it is coherent with an inner turmoil: the concept of “observational eros” as a partial interpretation of doing nothing raised by Odell. She explained, “[It] is an emotional fascination with a subject that is so strong it overpowers the desire to make anything new” (Odell 05:10-05:16). In her context, the humble observation toward objects signifies no indifference but an ecstatic obsession. Admittedly, such motivation contains a denial of the torso of artworks. Yet, such a documentary tool allows for the construction of unique profiling of exhibitions when they are presented within a personal domain. For another, as Percy suggests that “[Sightseeing] may be recovered by leaving the beaten track”, a walking journey instead of a tourist journey would ensure an authentic visit (48). Similarly, considering a rebellious travel within the Guggenheim Museum, a plausible solution will be bypassing the crowds and discovering the side chambers, where unnoticed oil canvas also stages intriguing performances.","In the presence of awe-inspiring artwork, I found myself transported to an illusion, where shadows cast by the frame on walls yields a perception of digital displays. The canvas thus became a peeled mural, leaving behind a tiny thickness of color, obscuring the story beneath. Yet Guggenheim’s ramp has its way to resist the flattening. The sunken display space, with raised floors and overhead lights, brings a mythological reverence. They are akin to figurines in shrines, vases behind a screen, and a grotto Buddha resides in a canyon. As they spread the halo of light beyond their picturesque appearances, they reclaim an architectural splendor that is often lost in reproduced images. It suppresses my morbid obsession with fleeting, sensational images and leaves me, both in my mind and in my physical being, with a profound nostalgia for classical artworks: the authenticity and irreproducible presence of Benjamin’s longing."]},"txt-9":{"title":"The Case Against Museums","paragraphs":["To fulfill our most primitive emotional impulse of curiosity¬—discovering something exotic and new—an intricate, omniscient machine is created, the museum. Yet, driven by such inflating human desire, the machine equips itself with an independent knowledge body due to the ever-expanding collections. An independent, authoritative stance is thus represented by the museums through its exhibit: the interlocking eyes of Byzantine statues and the huge paintings hanging high above the audience contribute to an undoubtable solemnity. Such authority even shrouds an unassuming clay debris and assigns it as a truth teller.","Common arguments for modern museums commend on such power of enlightening, or revelation. It is argued that they educate people in an engaging, truthful way. By offering tangible, authentic anthropological artifacts accompanied with a well-elaborated narrative, museums connect people to a geographically, or even historically distant world. However, although branded as a three-dimensional encyclopedia, is such power attaching to the exhibits defendable of its rationality on any level?","In her book, Museums and the Shaping of Knowledge, Eilean Hooper-Greenhill researched how museums, as an institution of education, shape knowledge. The book mainly focuses on how the cultural frameworks determining the knowledge body of museums follow different epistemes. That is, the ways through which we perceive truths influence how museums produce knowledge. In particular, the “disciplinary museum” arose, as the public museums are assigned as campaigns of the state to engage the populations into activities, where the visitors are regarded as beneficiary educated by the curators as specialist expertise’s (Hooper-Greenhill 168). Accordingly, this newly developed structure outlines the power/knowledge structure of the modern museums. Instead of merely labeling and classifying objects, it aims at recreating orders between objects and humans whereby new knowledge is shaped.","To provide a detailed explanation, Hooper-Greenhill described, such disciplinary order tears collections out from their original contexts and rearranges them in a way for a certain proclamation (171). In other words, the classification-centric curating represents this disciplinary order in practice. We could confirm such practice through museums’ devotion to embrace exhibitions of mainly rearticulations of collected objects. No matter how the preserved artifacts differ in its own cultural practices, either as a ceremonial appliance or a utility ware, they are unanimously gathered and served as textual materials for education.","Although the rearrangement of the collections, or curating, appears as a seemingly moderate, objective rule of categorization in modern museums, it is a structural violence to the collections as well as the audience’s experience. The organization behind the curating, the classification inherited from taxonomy, is a humanistic success. It is similar to precise, definite scalpels that sorts out the entangled dynamics and continuity of the external natural world and represent them in a summary of mere objects. Benefited from this technique, the museums rearrange the expanding collection according to patterns of regional cultures, genres, or religions. Yet, Henrietta Lichi’s informative arguments are helpful in developing qualitative analysis of this technique. In his essay “The Poetics and the Politics of Exhibiting Other Cultures”, Henrietta Lidchi is explicit about the arbitrary power of the museums. He argues that the institutional occupation of museums allows it to be the arbiter of meanings by articulating the structure of knowledge through the display (Hall 198). That is to say, the degree to which an audience approaches that culture depends on how museums articulate the exhibition through staging selected objects. In specific, considering the organization of the exhibit room, the classification refers to an arbitrary division, by which the iconic, or representative items are visible to the public while those considered to be more general are not. Various degrees of visibility form the hierarchical order, serving for particular thematic narratives. The Astor Chinese Garden Court in the Asian Art sector at the MET museum illustrated this tyranny. A series of objects, including scholar stones, a pavilion model, and a clay urn, are artificially gathered to recreate an authentic, vivid cultural scene. This rearrangement of artifacts is successful in imitation. Yet, it destroys the individuality of artifacts and overwhelms it by reinforcing a thematic narrative, as one would perceive it as a natural continuum instead of a mosaic of reality. If the classification ultimately aims at a representation of certain images, how much about the artifacts could we be revealed from them? Admittedly, this landscaping is not universal among its neighboring halls, but it clearly depicts the limited access brought by this arbitrary power to the artifacts. Therefore, we may conclude that the disruptive power dynamics between the viewer and the objects—the power determining whether and how an artifact is to be displayed—undermines the museums’ rationality.","Meanwhile, we might be caught in another conspiracy if we ever attempt to break this mirroring by widening our eyes and focusing on specific items. This is because individual objects in display are also under the charge of the disciplinary order in the process of rearrangement. Glamorized by the spotlights, they experience a deeper violence that tampers with their nature. For this reason, we shall take a further investigation of the artifacts themselves.","The way how cultural artifacts refer to temporal and spatial messages is rather tangible: they themselves are the physical evidence of specific moments of history. The forms, compositions, and unique tactility are descriptive texts of certain cultural rituals or beliefs. Among these forms of texts, the worn marks significantly dominate the audience's experience: the gully formed by weathering, creasing texture of oxidation, and disturbing fractures. These details of withering contextualize the artifacts, dragging the viewer from an indifferent skimming of cultural symbols into speculating living scenes surrounding the artifacts. However, how the authoritative institute curates its knowledge body conflicts with the audience's experience informed by such weathering traces. The conflict marks a transformed nature of the object. It is the disciplinary order, representing itself in dominating the physical spaces of exhibit rooms, that prohibits such experience. To encapsulate artifacts, born with specific utilities, into various sets of curated narratives, the curating process requires a confirmed possession and physical management of the objects. That is to say, such authoritative possession, often branded as preservation, demands a summary of pure, fixed concepts instead of living ones to represent moments of history mechanically. With such aim, it detaches artifacts from its environment and prohibits the natural process of withering. Meanwhile, it displays the artifacts in certain positions, lighting settings, and framing techniques.","The painting Buddha of Medicine Bhaishajyaguru in the Metropolitan Museum of Art specifically interprets such conflict. It evoked nostalgic, emotional reactions through its rough surface. The faded coloring and thin layers of ash on the painting of Buddha Bhaishajyaguru concretely reminds the audience of its story: numerous years of shrouding in the temple hall by the sunlight, incense, and the candles. However, the “funerary ceremony” demanded by the order begins with the painting being stripped from its sacred surroundings, the temple walls. Then, it was carefully framed and positioned in an exhibit room with equivalent physical size to the temple hall. The settings for this exhibition nearly portrait the original solemnity of the Buddha, yet behind the seemingly perfect curating efforts lies the disciplinary power. When preservation traces, considered as physical defects, are lost and the display confines the painting to an altar-like setting, a false name relying on the disciplinary order is entitled. The spiritual functions of it are depleted, whereas a pure symbol advances. The death of the Buddha fresco oozes from the dark brown, thick surface of pigment. It makes a muffle sound, demanding the audience to listen, like a low echoing complaint unanswered, while the disciplinary techniques choked that muffling crying and engaged the audience in this false solemnity.","One may thus conclude that desiring for something exotic and novel is so intense that a simple glimpse at a collection of astonishing artifacts could greatly fulfill such intrinsic impulse. That is the trickiness of illusions made by the museums. It crowns the artifacts with its authoritative stance and confines them into an array: a small exhibit room with a moment of alluring revelation.","Works Cited","Hall, Stuart, et al. Representation: Cultural Representations and Signifying Practices. Sage, 2013.","Hooper-Greenhill, Eilean. Museums and the Shaping of Knowledge. Routledge, 1991."]},"txt-10":{"title":"The Power of Invisible Images","paragraphs":["A watching carefully taken by viewers adds interpretations to the images. It is especially true for images carrying cultural significance, whose universal truths and crystallized aesthetic values are revealed to and explained by the audience.","However, this binary relationship is complicated by the absence of viewers. Mary Beard thought of Terracotta Warriors when confronted with such myths. Invisible images, like the terracotta statues with an eradicated presence of audience, require no less but more thorough interpretations on their undiscovered power. Through her essay “The Emperor of China and The Power of Images”, Mary Beard questioned why invisible images, like Terracotta Warriors that require extraordinary human efforts, can be meaningful and worthwhile. Meanwhile, she complicates this inquiry by focusing on the subtleties between invisible images and real-life counterparts: the formulaic yet individual likeness of the statues.","The paradox of the statues that Beard distinguished is a challenge to a crucial principle of human portraits, the resemblance. Looking at a single Terracotta Warrior helps one realize the efforts devoted to the vivid, accurate body sculpturing and facial painting. However, a study of these imperial guards in its entirety reveals a formulaic design that denies connections to the real-life counterparts of them. Mary explained such unique individuality this way, the efforts invested in the intricacy of the unseen funerary objects emphasizes the imperial authority (Beard 60). That is, the intricate resemblances serve higher purposes than representations. Hence, by means of such unique individuality, the statues transform from simple simulations to conceptual reproductions.","Fi.1. “Funerary Urn (Hunping).” The Art Institute of Chicago, Https://Www.Artic.Edu/Artworks/70003/Funerary-Urn-Hunping. Accessed 13 Oct. 2023.","Beard's interpretations on burial objects are insightful. It directs our attention from an appreciation toward refined craftsmanship to the indicative significance of cultural symbols. Accordingly, it helps us to read other forms of burial gifts in a new vision. Among all Chinese artifacts at The Art Institute of Chicago, an olive-green glazed urn of the 3rd century would possibly capture Beard’s interest by its indicative form of molding (Fig.1). Refined patterns of animals, human figures and architecture is attached to its entire surface. Yet, the unevenly applied glaze undermines the painstakingly created delicacy. This flaw in decoration ceases our temporary admiration toward the fineness of the molding. The crown-structure on the top denies its utility as an object, while the roughness on the surface reduces its pure aesthetic values. It thus shrouds the possible significance of the urn in mystery.","Question arises, if the accuracy of a human figure portrait is so crucial in empowering a soul inside that a minimal inadequacy in facial texture would deprive its artificial aura and turns it into a lump of clay. For what reasons would a clay urn underneath the earth bear a similar paradox as the terracotta figurines, a painstakingly crafted refinement beyond the purpose of simulations, if not as an assertion of hierarchical power. What inferences can be drawn from the dubious design, the dissolution of functionality, of this funerary urn? Ye
